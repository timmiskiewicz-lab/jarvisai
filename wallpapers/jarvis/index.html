<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>J.A.R.V.I.S.</title>
  <style>
    @font-face {
      font-family: "Orbitron";
      src: url("Orbitron.ttf") format("truetype");
      font-weight: 500;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 46%, rgba(18, 84, 112, 0.45), transparent 34%),
        radial-gradient(circle at 50% 50%, #0a2433 0%, #061018 58%, #03080d 100%);
      color: #d7f6ff;
      font-family: "Segoe UI", sans-serif;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .label {
      position: fixed;
      left: 0;
      right: 0;
      top: 7vh;
      text-align: center;
      font-family: Orbitron, "Segoe UI", sans-serif;
      letter-spacing: 0.42em;
      font-size: 22px;
      color: rgba(215, 246, 255, 0.82);
    }
    #caption {
      position: fixed;
      left: 12vw;
      right: 12vw;
      bottom: 8vh;
      text-align: center;
      min-height: 1.4em;
      color: #e2b15a;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="label">J.A.R.V.I.S.</div>
  <canvas id="rings"></canvas>
  <p id="caption"></p>
  <script>
    const canvas = document.getElementById("rings");
    const ctx = canvas.getContext("2d");
    const captionEl = document.getElementById("caption");
    const state = { mode: "idle", amplitude: 0, caption: "", status: "Standing by" };
    let smooth = 0;

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function draw(time) {
      const speaking = state.mode === "speaking";
      const listening = state.mode === "listening";
      const thinking = state.mode === "thinking";
      smooth += (state.amplitude - smooth) * (speaking ? 0.45 : 0.18);
      const amp = Math.max(0, Math.min(1, smooth));
      const w = window.innerWidth;
      const h = window.innerHeight;
      const cx = w / 2;
      const cy = h / 2;
      const base = Math.min(w, h) * 0.28;
      const speed = speaking ? 1.7 : listening ? 1.15 : 0.5;
      const spin = time / 1000;
      const breathe = speaking ? 0 : Math.sin(time / 900) * 0.018;
      const scale = 1 + breathe + amp * (speaking ? 0.34 : listening ? 0.16 : 0.08);
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);
      ring(cx, cy, base * 1.08, "rgba(110, 210, 240, 0.28)", 1.5, 0);
      ticks(cx, cy, base, spin * 0.12 * speed);
      segments(cx, cy, base * 0.9, spin * 0.32 * speed, amp);
      goldMarks(cx, cy, base);
      dashed(cx, cy, base * 0.74, -spin * 0.46 * speed);
      glow(cx, cy, base * 0.6, amp);
      mesh(cx, cy, base, spin, amp, listening || speaking || thinking);
      core(cx, cy, base, amp);
      ctx.restore();
      captionEl.textContent = state.mode === "idle" ? "" : (state.caption || state.status || "");
      requestAnimationFrame(draw);
    }

    function ring(cx, cy, radius, color, width, rotation) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function ticks(cx, cy, base, rotation) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.strokeStyle = "rgba(140, 230, 255, 0.7)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 120; i += 1) {
        const angle = (i / 120) * Math.PI * 2;
        const inner = base * (i % 10 === 0 ? 0.98 : 1.01);
        const outer = base * (i % 10 === 0 ? 1.08 : 1.045);
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
        ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
        ctx.stroke();
      }
      ctx.restore();
    }

    function segments(cx, cy, radius, rotation, amp) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.strokeStyle = "#8af4ff";
      ctx.lineWidth = 9;
      ctx.lineCap = "round";
      ctx.shadowColor = "#39dfff";
      ctx.shadowBlur = 18 + amp * 28;
      const count = 8;
      for (let i = 0; i < count; i += 1) {
        const gap = 0.34;
        const start = (i / count) * Math.PI * 2 + gap / 2;
        const end = ((i + 1) / count) * Math.PI * 2 - gap / 2;
        ctx.beginPath();
        ctx.arc(0, 0, radius, start, end);
        ctx.stroke();
      }
      ctx.restore();
    }

    function goldMarks(cx, cy, base) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = "#e2b15a";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#e2b15a";
      ctx.shadowBlur = 8;
      for (let i = 0; i < 8; i += 1) {
        const angle = Math.PI * 0.78 + i * 0.085;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * base * 0.8, Math.sin(angle) * base * 0.8);
        ctx.lineTo(Math.cos(angle) * base * 0.86, Math.sin(angle) * base * 0.86);
        ctx.stroke();
      }
      ctx.restore();
    }

    function dashed(cx, cy, radius, rotation) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.strokeStyle = "rgba(120, 220, 255, 0.75)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 12]);
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function glow(cx, cy, radius, amp) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = "rgba(190, 248, 255, 0.95)";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#7aefff";
      ctx.shadowBlur = 22 + amp * 36;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function mesh(cx, cy, base, spin, amp, active) {
      const rings = 4;
      const points = 14;
      const coords = [];
      for (let ringIndex = 1; ringIndex <= rings; ringIndex += 1) {
        const row = [];
        const radius = base * 0.12 + ringIndex * base * 0.075 + amp * (8 + ringIndex * 4);
        for (let point = 0; point < points; point += 1) {
          const angle = (point / points) * Math.PI * 2 + spin * (active ? 0.35 : 0.12);
          row.push([Math.cos(angle) * radius, Math.sin(angle) * radius]);
        }
        coords.push(row);
      }
      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = `rgba(150, 235, 255, ${0.22 + amp * 0.6})`;
      ctx.lineWidth = 1.15;
      coords.forEach((row, ringIndex) => {
        row.forEach(([x, y], point) => {
          const next = row[(point + 1) % row.length];
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(next[0], next[1]);
          ctx.stroke();
          if (coords[ringIndex + 1]) {
            const down = coords[ringIndex + 1][point];
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(down[0], down[1]);
            ctx.stroke();
          }
        });
      });
      ctx.restore();
    }

    function core(cx, cy, base, amp) {
      const gradient = ctx.createRadialGradient(cx, cy, 8, cx, cy, base * 0.32);
      gradient.addColorStop(0, `rgba(110, 230, 255, ${0.28 + amp * 0.5})`);
      gradient.addColorStop(1, "rgba(6, 16, 24, 0)");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(cx, cy, base * 0.34, 0, Math.PI * 2);
      ctx.fill();
    }

    async function poll() {
      try {
        const response = await fetch("http://127.0.0.1:47321/state", { cache: "no-store" });
        if (response.ok) {
          const next = await response.json();
          state.mode = next.mode || "idle";
          state.amplitude = Number(next.amplitude || 0);
          state.caption = next.caption || "";
          state.status = next.status || "Standing by";
        }
      } catch (error) {
        state.mode = "idle";
        state.amplitude = 0;
      }
      setTimeout(poll, 50);
    }

    resize();
    window.addEventListener("resize", resize);
    requestAnimationFrame(draw);
    poll();
  </script>
</body>
</html>
