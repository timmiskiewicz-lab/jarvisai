<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JarvisAI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grid"></div>
  <div class="vignette"></div>
  <header>
    <span class="brand pywebview-drag-region">J.A.R.V.I.S.</span>
    <div class="drag-fill pywebview-drag-region"></div>
    <div class="actions">
      <button id="settings-open" type="button" title="Settings">⚙</button>
      <button id="hide" type="button" title="Hide to tray">–</button>
    </div>
  </header>

  <main>
    <div id="orb" class="pywebview-drag-region">
      <canvas id="rings" width="640" height="640"></canvas>
      <div class="core">
        <p class="title">J.A.R.V.I.S.</p>
        <p id="status">Starting systems</p>
      </div>
    </div>
    <p id="caption"></p>
    <p id="voice">Voice</p>
  </main>

  <section id="settings" class="hidden">
    <div class="panel">
      <h2>Gemini</h2>
      <p>Paste your Gemini API key here and press Save. Jarvis stores it in the GEMINI_API_KEY user variable.</p>
      <label for="gemini-key">Gemini API key</label>
      <input id="gemini-key" type="password" autocomplete="off" spellcheck="false" />
      <h2>Voice</h2>
      <p>The Jarvis voice is already built in. An ElevenLabs key is optional and only used for lines that were not recorded.</p>
      <label for="api-key">ElevenLabs API key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" />
      <div class="row">
        <button id="save" type="button">Save</button>
        <button id="test-voice" type="button">Test voice</button>
        <button id="listen-now" type="button">Listen now</button>
        <button id="install-wallpaper" type="button">Install wallpaper</button>
      </div>
      <p id="settings-note"></p>
      <button id="settings-close" type="button" class="ghost">Close</button>
    </div>
  </section>
  <script src="hud.js"></script>
</body>
</html>
